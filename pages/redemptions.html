<!--
  Loyalty · Redemption history (spec §52), opened from Coins
  States (combine with commas):
    Page: orders-empty, orders-more
    Page status: loading, error  (spec §44)

    ord_91d4b2 (PLN token), ord_a03f77 (new), ord_3b8c15 (cancelled, refunded), ord_e61d90 (failed), ord_2d7c44 (two items)
  Shared states (empty, needs-kyc, needs-deposit, expiring, activity-empty) carry over between pages.   Theme: ?theme=dark|light (default follows the device)
-->
